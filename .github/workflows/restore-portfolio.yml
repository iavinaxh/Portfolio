name: Restore and update portfolio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore original production source
        run: |
          curl -fsSL https://poprtfolio-53dvoagxj-iavinaxhs-projects.vercel.app/index.html -o index.html
          curl -fsSL https://poprtfolio-53dvoagxj-iavinaxhs-projects.vercel.app/script.js -o script.js
          curl -fsSL https://poprtfolio-53dvoagxj-iavinaxhs-projects.vercel.app/style.css -o style.css

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Kanpur, Uttar Pradesh', 'Noida, Uttar Pradesh')
          s = s.replace('B.Tech in Information Technology', 'B.Tech in Computer Science & Engineering')
          s = s.replace('Bachelor of Technology in Information Technology', 'Bachelor of Technology in Computer Science & Engineering')
          s = s.replace('A passionate Computer Science undergraduate specializing in full-stack web development.', 'A results-driven Software Development Engineer with experience building scalable web applications, integrating RESTful APIs, debugging production systems, and improving software reliability through testing and automation.')
          p.write_text(s, encoding='utf-8')

          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('B.Tech in Information Technology', 'B.Tech in Computer Science & Engineering')
          s = s.replace('Unit Testing (Jest), Integration Testing', 'Unit Testing (Jest), Integration Testing, Selenium')
          s = s.replace('  [3] <span class="text-purple">Second-Hand Book Store Platform</span>: Agile SDLC + SQL & MongoDB.\n', '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js style.css
          git diff --cached --quiet || git commit -m "Update portfolio from latest resume"
          git push
